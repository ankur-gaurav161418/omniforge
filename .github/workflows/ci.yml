name: OmniForge CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo packages
        run: npm run build

      - name: Run Vitest unit & integration tests
        run: npm test

      - name: Run OmniForge CLI doctor check
        run: node cli/dist/index.js doctor
