version: '3.8'

services:
  omniforge-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omniforge-mcp-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - OMNIFORGE_MCP_PORT=8080
      - OMNIFORGE_MCP_TRANSPORT=http
    restart: unless-stopped
